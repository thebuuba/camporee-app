name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec opennextjs-cloudflare build
      - name: Check actual Workers runtime
        run: |
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/camporee-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/test-worker.mjs || { cat /tmp/camporee-worker.log; exit 1; }

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start isolated PostgreSQL
        run: docker run --name camporee-multitenant-db --network none -e POSTGRES_PASSWORD=camporee-local-test -d supabase/postgres:15.8.1.085
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 75); do
            if docker exec camporee-multitenant-db pg_isready -h 127.0.0.1 -U supabase_admin -d postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Validate migration, data preservation and tenant RLS
        run: npm run test:db
      - name: Validate actual production-shaped legacy schema (missing duty column)
        run: npm run test:db -- --production-legacy
